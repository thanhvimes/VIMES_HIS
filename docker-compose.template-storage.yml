services:
  redis-template-queue:
    image: redis:7.4-alpine
    container_name: vimes-redis-template-queue
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - vimes_redis_template_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio-template-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vimes-minio-template-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vimes_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
      MINIO_KMS_KES_ENDPOINT: ${MINIO_KMS_KES_ENDPOINT:-}
      MINIO_KMS_KES_KEY_NAME: ${MINIO_KMS_KES_KEY_NAME:-vimes-document-key}
    volumes:
      - vimes_minio_template_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-template-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio-template-storage
    entrypoint: /bin/sh
    command: >-
      -c "until mc alias set local http://minio-template-storage:9000
      $${MINIO_ROOT_USER:-vimes_minio} $${MINIO_ROOT_PASSWORD:-change_this_minio_password}; do sleep 2; done;
      mc mb --ignore-existing local/vimes-document-templates;
      mc mb --ignore-existing local/vimes-document-previews;
      mc mb --ignore-existing local/vimes-generated-documents;
      mc anonymous set none local/vimes-document-templates;
      mc anonymous set none local/vimes-document-previews;
      mc anonymous set none local/vimes-generated-documents;
      mc version enable local/vimes-document-templates;
      mc admin user add local $${MINIO_SERVICE_ACCESS_KEY:?Set MINIO_SERVICE_ACCESS_KEY} $${MINIO_SERVICE_SECRET_KEY:?Set MINIO_SERVICE_SECRET_KEY} || true;
      mc admin policy attach local readwrite --user $${MINIO_SERVICE_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vimes_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
      MINIO_SERVICE_ACCESS_KEY: ${MINIO_SERVICE_ACCESS_KEY:?Set in .env}
      MINIO_SERVICE_SECRET_KEY: ${MINIO_SERVICE_SECRET_KEY:?Set in .env}

volumes:
  vimes_minio_template_data:
  vimes_redis_template_data:
