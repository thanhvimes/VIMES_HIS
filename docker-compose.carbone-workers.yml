services:
  carbone-lb:
    image: nginx:1.27-alpine
    container_name: vimes-carbone-lb
    depends_on:
      carbone-renderer-1:
        condition: service_healthy
      carbone-renderer-2:
        condition: service_healthy
    ports:
      - "${CARBONE_LB_PORT:-4010}:4000"
    volumes:
      - ./carbone-lb.conf:/etc/nginx/conf.d/default.conf:ro

  carbone-renderer-1:
    build:
      context: .
      dockerfile: Dockerfile.carbone-vimes
    container_name: vimes-carbone-renderer-1
    restart: unless-stopped
    environment:
      CARBONE_EE: "true"
    ports:
      - "4001:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  carbone-renderer-2:
    build:
      context: .
      dockerfile: Dockerfile.carbone-vimes
    container_name: vimes-carbone-renderer-2
    restart: unless-stopped
    environment:
      CARBONE_EE: "true"
    ports:
      - "4002:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
