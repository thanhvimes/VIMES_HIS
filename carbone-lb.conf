upstream carbone_pool {
    least_conn;
    server carbone-renderer-1:4000 max_fails=3 fail_timeout=10s;
    server carbone-renderer-2:4000 max_fails=3 fail_timeout=10s;
}

server {
    listen 4000;
    location / {
        proxy_pass http://carbone_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
