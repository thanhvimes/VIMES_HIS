<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- White Inner Shield / Circle -->
  <circle cx="50" cy="50" r="32" fill="#ffffff" opacity="0.95"/>

  <!-- Red Medical Cross in center -->
  <path d="M 44 28 H 56 V 44 H 72 V 56 H 56 V 72 H 44 V 56 H 28 V 44 H 44 Z" fill="url(#crossGrad)" rx="2"/>

  <!-- Stylized V curve accent -->
  <path d="M 30 68 Q 50 82 70 68" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
</svg>
