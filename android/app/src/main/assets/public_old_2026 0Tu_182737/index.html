              // --- LIGHT THEME ---
              background: '#f8fafc', // slate-50 (Very light cool grey)
              surface: '#ffffff',
              onPrimary: '#ffffff',
              onSurface: '#1e293b', // slate-800
              
              // --- DARK THEME (Refined: Lighter Slate) ---

                surface: '#1e293b',    // slate-800 (Was slate-900)
                onSurface: '#f1f5f9',  // slate-100

                border: '#334155',     // slate-700
              }
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              bounceIn: {
                '0%': { transform: 'translate(-50%, 100%) scale(0.5)', opacity: '0' },
                '50%': { transform: 'translate(-50%, -10%) scale(1.05)' },
                '70%': { transform: 'translate(-50%, 5%) scale(0.95)' },
                '100%': { transform: 'translate(-50%, 0) scale(1)', opacity: '1' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.6' },
              },
              zoomIn: {

                '100%': { transform: 'scale(1)', opacity: '1' },

            },
            animation: {

              'fade-in-up': 'fadeInUp 0.4s ease-out',
              'slide-in-up': 'slideInUp 0.4s ease-out forwards',
              'bounce-in': 'bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
              'pulse-slow': 'pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',

    <style>
      /* ==================== QUICK WINS: ENHANCED STYLES ==================== */
      
      /* --- Global Professional Scrollbar --- */
      
      /* 1. Firefox Standards */
      * {
        scrollbar-width: thin;
        scrollbar-color: #14b8a6 transparent; /* Teal thumb for better visibility */
      }
      
      .dark * {
        scrollbar-color: #0d9488 transparent; /* Teal for dark mode */
      }

      /* 2. WebKit Browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 8px;  /* Slightly wider for better UX */
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* Transparent corner where scrollbars meet */
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #14b8a6, #0d9488); /* Gradient teal */
        border-radius: 10px;
        border: 1px solid transparent;
        background-clip: content-box;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #0d9488, #0f766e);
        transform: scaleY(1.1);
      }
      
      /* Dark Mode Overrides */
      .dark ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #0d9488, #0f766e);
        border: 1px solid #1e293b;
      }

      .dark ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #14b8a6, #0d9488);
      }

      /* --- QUICK WIN: Smooth Transitions for All Interactive Elements --- */
      button, a, input, select, textarea, [role="button"] {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Enhanced button hover effects */
      button:not(:disabled):hover {
        transform: translateY(-1px);
      }

      button:not(:disabled):active {
        transform: translateY(0);
      }

      /* --- QUICK WIN: Enhanced Input Focus States --- */
      input:focus, select:focus, textarea:focus {
        outline: none;
        transform: scale(1.01);
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
      }

      .dark input:focus, .dark select:focus, .dark textarea:focus {
        box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
      }

      /* --- QUICK WIN: Card Hover Effects --- */
      .hover-lift {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }

      .dark .hover-lift:hover {
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      }

      /* --- QUICK WIN: Glassmorphism Effect --- */
      .glass-effect {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .dark .glass-effect {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* --- QUICK WIN: Pulse Glow Animation --- */
      @keyframes pulseGlow {
        0%, 100% {
          box-shadow: 0 0 20px rgba(13, 148, 136, 0.3);
        }
        50% {
          box-shadow: 0 0 30px rgba(13, 148, 136, 0.5);
        }
      }

      .pulse-glow {
        animation: pulseGlow 2s ease-in-out infinite;
      }

      /* --- QUICK WIN: Shimmer Loading Effect --- */
      @keyframes shimmer {
        0% {
          background-position: -1000px 0;
        }
        100% {
          background-position: 1000px 0;
        }
      }

      .shimmer {
        background: linear-gradient(
          90deg,
          #f0f0f0 0%,
          #f8f8f8 50%,
          #f0f0f0 100%
        );
        background-size: 1000px 100%;
        animation: shimmer 2s infinite;
      }

      .dark .shimmer {
        background: linear-gradient(
          90deg,
          #1e293b 0%,
          #334155 50%,
          #1e293b 100%
        );
        background-size: 1000px 100%;
      }

      /* --- QUICK WIN: Slide In Animations --- */
      @keyframes slideInRight {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .slide-in-right {
        animation: slideInRight 0.3s ease-out;
      }

      @keyframes slideInLeft {
        from {
          transform: translateX(-100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .slide-in-left {
        animation: slideInLeft 0.3s ease-out;
      }

      /* --- QUICK WIN: Scale In Animation --- */
      @keyframes scaleIn {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .scale-in {
        animation: scaleIn 0.2s ease-out;
      }

      /* --- QUICK WIN: Ripple Effect --- */
      .ripple {
        position: relative;
        overflow: hidden;
      }

      .ripple::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      .ripple:active::after {
        width: 300px;
        height: 300px;
      }

      /* --- Native App Feel & Zoom Blocking --- */
      html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Allow text selection only in inputs and text areas */
      input, textarea, [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
      }

      /* --- Input Autofill Fixes --- */
      /* Light Mode */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px white inset !important;
          -webkit-text-fill-color: #1e293b !important;
          transition: background-color 5000s ease-in-out 0s;
      }
      
      /* Dark Mode */
      .dark input:-webkit-autofill,
      .dark input:-webkit-autofill:hover, 
      .dark input:-webkit-autofill:focus, 
      .dark input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
          -webkit-text-fill-color: #f1f5f9 !important;
          caret-color: white;
      }

      /* --- Utility Classes --- */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #14b8a6, #0d9488);
        border-radius: 6px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #0d9488, #0f766e);
      }

      /* --- QUICK WIN: Loading Spinner --- */
      @keyframes spin-slow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .spin-slow {
        animation: spin-slow 1.5s linear infinite;
      }

      /* Print Styles */
      @media print {
        .no-print {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
        }
        body {
          background-color: white !important;
          color: black !important;
          overflow: visible !important;
        }
        .printable-area {
          box-shadow: none !important;
          border: none !important;
        }
        ::-webkit-scrollbar {
          display: none;
        }
        * {
            scrollbar-width: none !important;
        }
      }
    </style>
