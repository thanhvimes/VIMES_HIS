
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#06b6d4', // cyan-500
                light: '#22d3ee',   // cyan-400
                dark: '#0891b2',    // cyan-600
              },
              secondary: '#10b981', // emerald-500
              // Light theme colors
              background: '#f8fafc', // slate-50
              surface: '#ffffff',
              onPrimary: '#ffffff',
              onSurface: '#1e293b', // slate-800
              // Dark theme colors
              dark: {
                background: '#0f172a', // slate-900
                surface: '#1e293b',   // slate-800
                onSurface: '#e2e8f0', // slate-200
                primary: '#22d3ee', // cyan-400
              }
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              bounceIn: {
                '0%': { transform: 'translate(-50%, 100%) scale(0.5)', opacity: '0' },
                '50%': { transform: 'translate(-50%, -10%) scale(1.05)' },
                '70%': { transform: 'translate(-50%, 5%) scale(0.95)' },
                '100%': { transform: 'translate(-50%, 0) scale(1)', opacity: '1' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.6' },
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'fade-in-up': 'fadeInUp 0.4s ease-out',
              'slide-in-up': 'slideInUp 0.4s ease-out forwards',
              'bounce-in': 'bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
              'pulse-slow': 'pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    <style>
      /* --- Global Professional Scrollbar --- */
      
      /* 1. Firefox Standards */
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent; /* Thumb | Track */
      }
      
      .dark * {
        scrollbar-color: #475569 transparent;
      }

      /* 2. WebKit Browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 6px;  /* Thinner scrollbar */
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* Transparent corner where scrollbars meet */
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1; /* slate-300 */
        border-radius: 10px;
        border: 1px solid transparent;
        background-clip: content-box;
        transition: background-color 0.2s ease-in-out;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8; /* slate-400 */
      }
      
      /* Dark Mode Overrides */
      .dark ::-webkit-scrollbar-thumb {
        background-color: #334155; /* slate-700 */
      }

      .dark ::-webkit-scrollbar-thumb:hover {
        background-color: #475569; /* slate-600 */
      }

      /* --- Input Autofill Fixes --- */
      /* Light Mode */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px white inset !important;
          -webkit-text-fill-color: #1e293b !important;
          transition: background-color 5000s ease-in-out 0s;
      }
      
      /* Dark Mode */
      .dark input:-webkit-autofill,
      .dark input:-webkit-autofill:hover, 
      .dark input:-webkit-autofill:focus, 
      .dark input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px #334155 inset !important; /* Slate-700 to match inputs */
          -webkit-text-fill-color: white !important;
          caret-color: white;
      }

      /* --- Utility Utilities --- */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #475569;
      }

      /* Print Styles */
      @media print {
        .no-print {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
        }
        body {
          background-color: white !important;
          color: black !important;
        }
        .printable-area {
          box-shadow: none !important;
          border: none !important;
        }
        /* Hide scrollbars in print */
        ::-webkit-scrollbar {
          display: none;
        }
        * {
            scrollbar-width: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

    "signature_pad": "https://aistudiocdn.com/signature_pad@^5.0.2",
    "jspdf": "https://aistudiocdn.com/jspdf@^2.5.1",
    "jspdf-autotable": "https://aistudiocdn.com/jspdf-autotable@^3.8.2",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1"
  }
}
</script>
</head>
