<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#06b6d4', // cyan-500
                light: '#22d3ee',   // cyan-400
                dark: '#0891b2',    // cyan-600
              },
              secondary: '#10b981', // emerald-500
              // Light theme colors
              background: '#f8fafc', // slate-50
              surface: '#ffffff',
              onPrimary: '#ffffff',
              onSurface: '#1e293b', // slate-800
              // Dark theme colors
              dark: {
                background: '#0f172a', // slate-900
                surface: '#1e293b',   // slate-800
                onSurface: '#e2e8f0', // slate-200
                primary: '#22d3ee', // cyan-400
              }
            },
          },
        },
      }
    </script>
    <style>
      /* --- Global Professional Scrollbar --- */
      
      /* 1. Firefox Standards */
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent; /* Thumb | Track */
      }
      
      .dark * {
        scrollbar-color: #475569 transparent;
      }

      /* 2. WebKit Browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 8px;  /* Width of vertical scrollbar */
        height: 8px; /* Height of horizontal scrollbar */
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* Transparent corner where scrollbars meet */
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1; /* slate-300 */
        border-radius: 6px;
        border: 2px solid transparent; /* Creates the 'floating' padding effect */
        background-clip: content-box;  /* Paints background only inside border */
        transition: background-color 0.2s ease-in-out;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8; /* slate-400 */
      }
      
      ::-webkit-scrollbar-thumb:active {
        background-color: #64748b; /* slate-500 */
      }

      /* Dark Mode Overrides */
      .dark ::-webkit-scrollbar-thumb {
        background-color: #334155; /* slate-700 */
      }

      .dark ::-webkit-scrollbar-thumb:hover {
        background-color: #475569; /* slate-600 */
      }

      .dark ::-webkit-scrollbar-thumb:active {
        background-color: #64748b; /* slate-500 */
      }

      /* Print Styles */
      @media print {
        .no-print {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
        }
        body {
          background-color: white !important;
        }
        .printable-area {
          box-shadow: none !important;
          border: none !important;
        }
        /* Hide scrollbars in print */
        ::-webkit-scrollbar {
          display: none;
        }
        * {
            scrollbar-width: none !important;
        }
      }
    </style>
