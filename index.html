
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Clinic Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#0d9488', // teal-600 (Light mode primary - Matches Portal)
                light: '#2dd4bf',   // teal-400
                dark: '#0f766e',    // teal-700
              },
              secondary: '#10b981', // emerald-500
              
              // --- LIGHT THEME ---
              background: '#f8fafc', // slate-50 (Very light cool grey)
              surface: '#ffffff',
              onPrimary: '#ffffff',
              onSurface: '#1e293b', // slate-800
              
              // --- DARK THEME (Refined: Lighter Slate) ---
              dark: {
                background: '#0f172a', // slate-900 (Was slate-950)
                surface: '#1e293b',    // slate-800 (Was slate-900)
                onSurface: '#f1f5f9',  // slate-100
                primary: '#38bdf8',    // sky-400
                border: '#334155',     // slate-700
              }
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              bounceIn: {
                '0%': { transform: 'translate(-50%, 100%) scale(0.5)', opacity: '0' },
                '50%': { transform: 'translate(-50%, -10%) scale(1.05)' },
                '70%': { transform: 'translate(-50%, 5%) scale(0.95)' },
                '100%': { transform: 'translate(-50%, 0) scale(1)', opacity: '1' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.6' },
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'fade-in-up': 'fadeInUp 0.4s ease-out',
              'slide-in-up': 'slideInUp 0.4s ease-out forwards',
              'bounce-in': 'bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
              'pulse-slow': 'pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    <style>
      /* --- Global Professional Scrollbar --- */
      
      /* 1. Firefox Standards */
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent; /* Thumb | Track */
      }
      
      .dark * {
        scrollbar-color: #475569 transparent; /* Lighter thumb for dark mode */
      }

      /* 2. WebKit Browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 6px;  /* Thinner scrollbar */
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* Transparent corner where scrollbars meet */
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1; /* slate-300 */
        border-radius: 10px;
        border: 1px solid transparent;
        background-clip: content-box;
        transition: background-color 0.2s ease-in-out;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8; /* slate-400 */
      }
      
      /* Dark Mode Overrides */
      .dark ::-webkit-scrollbar-thumb {
        background-color: #334155; /* slate-700 */
        border: 1px solid #1e293b;
      }

      .dark ::-webkit-scrollbar-thumb:hover {
        background-color: #475569; /* slate-600 */
      }

      /* --- Native App Feel & Zoom Blocking --- */
      html, body {
        height: 100%;
        overflow: hidden; /* Prevent body scroll, handle scroll in containers */
        overscroll-behavior: none; /* Prevent bounce effect on Mac/iOS */
        touch-action: manipulation; /* Disable double-tap zoom */
        -webkit-tap-highlight-color: transparent; /* Remove tap highlight */
        -webkit-text-size-adjust: 100%; /* Prevent font scaling */
        user-select: none; /* Disable text selection globally */
        -webkit-user-select: none;
      }

      /* Allow text selection only in inputs and text areas */
      input, textarea, [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
      }

      /* --- Input Autofill Fixes --- */
      /* Light Mode */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px white inset !important;
          -webkit-text-fill-color: #1e293b !important;
          transition: background-color 5000s ease-in-out 0s;
      }
      
      /* Dark Mode - Fix for the new Slate-900 background */
      .dark input:-webkit-autofill,
      .dark input:-webkit-autofill:hover, 
      .dark input:-webkit-autofill:focus, 
      .dark input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px #1e293b inset !important; /* Matches Slate-800 surface */
          -webkit-text-fill-color: #f1f5f9 !important;
          caret-color: white;
      }

      /* --- Utility Utilities --- */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #475569;
      }

      /* Print Styles */
      @media print {
        .no-print {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
        }
        body {
          background-color: white !important;
          color: black !important;
          overflow: visible !important;
        }
        .printable-area {
          box-shadow: none !important;
          border: none !important;
        }
        /* Hide scrollbars in print */
        ::-webkit-scrollbar {
          display: none;
        }
        * {
            scrollbar-width: none !important;
        }
      }
    </style>

</script>
</head>
